<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>domlet example</title>
</head>
<body>
  <p id="loading" role="status">Loading UI...</p>
  <noscript>This UI requires JavaScript and WebAssembly.</noscript>
  <script type="module">
    const loading = document.getElementById("loading");
    try {
      const { default: init } = await import("./pkg/domlet_example.js");
      await init();
      loading.remove();
    } catch (error) {
      loading.setAttribute("role", "alert");
      loading.textContent = "UI failed to load. Build with wasm-pack and serve this directory over HTTP. " + error;
      console.error(error);
    }
  </script>
</body>
</html>
