name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            example-server -> target
      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Test desktop example server
        run: cargo test --manifest-path example-server/Cargo.toml --locked

  msrv:
    name: MSRV (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.81.0'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace with Rust 1.81
        run: cargo check --workspace --locked
      - name: Check WebAssembly example with Rust 1.81
        run: cargo check -p slint-dom-example --target wasm32-unknown-unknown --locked
  check:
    name: Checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,thumbv8m.main-none-eabihf
          components: rustfmt, clippy
      # example-server is a separate workspace with its own target directory.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            example-server -> target
      - uses: taiki-e/install-action@wasm-pack
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Test desktop example server
        run: cargo test --manifest-path example-server/Cargo.toml --locked
      - name: Check desktop example server
        run: cargo check --manifest-path example-server/Cargo.toml --locked
      - name: Validate crates.io package archives
        run: |
          cargo package -p slint-dom-macros --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Package both workspace crates in one invocation so Cargo can build
          # the root archive before the matching macro version is published.
          # Workspace tests above validate the local pair together.
          cargo package -p slint-dom-macros -p slint-dom --locked --no-verify
      - name: Check WebAssembly example
        run: cargo check -p slint-dom-example --target wasm32-unknown-unknown --locked
      - name: Run browser tests
        # ChromeDriver can start slowly on Windows runners; the runner's
        # default wait fails with "driver failed to bind port during startup".
        env:
          WASM_BINDGEN_TEST_DRIVER_TIMEOUT: '60'
        run: wasm-pack test --headless --chrome
      - name: Build the README quick-start consumer
        shell: pwsh
        run: |
          wasm-pack build test-slint-dom-user --target web --release --out-dir pkg --out-name app --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in @('test-slint-dom-user/pkg/app.js', 'test-slint-dom-user/pkg/app_bg.wasm')) {
            if ((Get-Item -LiteralPath $file -ErrorAction Stop).Length -eq 0) {
              throw "Empty browser asset: $file"
            }
          }
          if (-not (Select-String -LiteralPath test-slint-dom-user/index.html -SimpleMatch '"./pkg/app.js"' -Quiet)) {
            throw 'HTML loader does not reference pkg/app.js'
          }
      # Checked before the raw budget so the size users actually download is
      # always reported, even when the raw compiler artifact is over budget.
      - name: Build and check deployed browser package
        shell: pwsh
        run: |
          wasm-pack build example --target web --release --out-dir pkg --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bytes = (Get-Item -LiteralPath example/pkg/slint_dom_example_bg.wasm -ErrorAction Stop).Length
          Write-Host "Deployed example WASM: $bytes bytes"
          # The example deliberately enables the optional JSON-RPC client.
          # Keep a meaningful deployed-package limit without rejecting it.
          if ($bytes -eq 0 -or $bytes -gt 200000) { throw 'Deployed WASM size budget failed' }
          if ((Get-Item -LiteralPath example/pkg/slint_dom_example.js -ErrorAction Stop).Length -eq 0) {
            throw 'Empty JavaScript loader'
          }
      - name: Enforce example WASM size budget
        shell: pwsh
        run: |
          cargo build -p slint-dom-example --release --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bytes = (Get-Item -LiteralPath target/wasm32-unknown-unknown/release/slint_dom_example.wasm -ErrorAction Stop).Length
          Write-Host "Raw example WASM: $bytes bytes"
          # The raw compiler output still carries wasm-bindgen metadata that
          # wasm-pack strips; the deployed check above is what users download.
          # Measured at ~782 KB (deployed ~153 KB); this only guards growth.
          if ($bytes -eq 0 -or $bytes -gt 850000) { throw 'Raw WASM size budget failed' }
      - name: Build Pico 2 + W5500 embedded server
        run: >-
          cargo build --manifest-path example-server/Cargo.toml
          --no-default-features --features embedded
          --bin slint-dom-pico2-w5500
          --target thumbv8m.main-none-eabihf --release --locked
