name: CI

on:
  push:
  pull_request:

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.81.0'
          targets: wasm32-unknown-unknown
      - run: cargo check --workspace --locked
      - run: cargo check -p slint-dom-example --target wasm32-unknown-unknown --locked
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: taiki-e/install-action@wasm-pack
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --manifest-path example-server/Cargo.toml --locked
      - run: cargo check --manifest-path example-server/Cargo.toml --locked
      - run: cargo package -p slint-dom-macros --locked
      - run: cargo check -p slint-dom-example --target wasm32-unknown-unknown
      - run: wasm-pack test --headless --chrome
      - name: Build the README quick-start consumer
        shell: bash
        run: |
          wasm-pack build test-slint-dom-user --target web --release --out-dir pkg --out-name app --locked
          test -s test-slint-dom-user/pkg/app.js
          test -s test-slint-dom-user/pkg/app_bg.wasm
          grep -q '"./pkg/app.js"' test-slint-dom-user/index.html
      - name: Enforce example WASM size budget
        shell: bash
        run: |
          cargo build -p slint-dom-example --release --target wasm32-unknown-unknown
          bytes=$(stat -c%s target/wasm32-unknown-unknown/release/slint_dom_example.wasm)
          echo "Raw example WASM: ${bytes} bytes"
          test "$bytes" -le 700000
      - name: Build and check deployed browser package
        shell: bash
        run: |
          wasm-pack build example --target web --release --out-dir pkg --locked
          bytes=$(stat -c%s example/pkg/slint_dom_example_bg.wasm)
          echo "Deployed example WASM: ${bytes} bytes"
          # The example deliberately enables the optional JSON-RPC client.
          # Keep a meaningful deployed-package limit without rejecting it.
          test "$bytes" -le 200000
          test -s example/pkg/slint_dom_example.js
