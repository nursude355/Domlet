[package]
name = "slint-dom-example-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false

# This is an application, deliberately outside the publishable workspace.
[workspace]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7.1", features = ["fs"] }
webbrowser = "1"
slint-dom = "0.1"