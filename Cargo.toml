[package]
name = "domlet"
version = "0.3.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "Small web UIs for embedded devices in Rust/WASM: compiles a subset of the .slint UI language into native browser DOM"
repository = "https://github.com/nursude355/Domlet"
documentation = "https://docs.rs/domlet"
readme = "README.md"
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    # User documentation only; internal design drafts in docs/design/ stay out.
    "docs/guide.md",
    "docs/runtime-contract.md",
]
keywords = ["wasm", "web", "gui", "dom", "embedded"]
categories = ["gui", "web-programming", "wasm", "embedded"]

[workspace]
resolver = "2"
members = ["macros", "example", "test-domlet-user"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
domlet-macros = { path = "macros", version = "0.3.0" }
wasm-bindgen = "0.2.129"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlHeadElement", "HtmlInputElement", "KeyboardEvent", "KeyboardEventInit", "MessageEvent", "Node", "WebSocket", "Window"] }

[features]
default = []
# Browser WebSocket client implementing the small JSON-RPC 2.0 transport used
# by the standalone example server. Kept optional so DOM-only apps stay small.
rpc = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
