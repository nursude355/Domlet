[package]
name = "slint-dom"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "Compile a web-focused Slint subset into lightweight native DOM components"
repository = "https://github.com/nursude355/Slint_Dom"
documentation = "https://docs.rs/slint-dom"
readme = "README.md"
keywords = ["slint", "wasm", "web", "gui", "dom"]
categories = ["gui", "web-programming", "wasm"]

[workspace]
resolver = "2"
members = ["macros", "example"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
slint-dom-macros = { path = "macros", version = "0.1.0" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlHeadElement", "HtmlInputElement", "Node", "Window"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
