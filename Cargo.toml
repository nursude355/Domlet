[package]
name = "slint-dom"
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "Compile a web-focused Slint subset into lightweight native DOM components"
repository = "https://github.com/nursude355/Slint_Dom"
documentation = "https://docs.rs/slint-dom"
readme = "README.md"
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "docs/**",
]
keywords = ["slint", "wasm", "web", "gui", "dom"]
categories = ["gui", "web-programming", "wasm"]

[workspace]
resolver = "2"
members = ["macros", "example", "test-slint-dom-user"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
slint-dom-macros = { path = "macros", version = "0.2.0" }
wasm-bindgen = "0.2.129"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlHeadElement", "HtmlInputElement", "KeyboardEvent", "KeyboardEventInit", "MessageEvent", "Node", "WebSocket", "Window"] }

[features]
default = []
# Browser WebSocket client implementing the small JSON-RPC 2.0 transport used
# by the standalone example server. Kept optional so DOM-only apps stay small.
rpc = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
